name: Build WorkZen APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "icons/workzen.png"
      - ".github/workflows/build-workzen-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses and install platform
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Add supplied WorkZen logo
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp android-app/workzen-logo.jpg android-app/app/src/main/res/drawable-nodpi/workzen_logo.jpg

      - name: Build signed debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to the website download path
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk app/WorkZen.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f app/taskflex.apk || true
          git add app/WorkZen.apk
          git commit -m "Publish updated WorkZen APK"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkZen-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
