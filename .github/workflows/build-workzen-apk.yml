name: Build WorkZen APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "icons/workzen.png"
      - ".github/workflows/build-workzen-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add supplied WorkZen logo
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp icons/workzen.png android-app/app/src/main/res/drawable-nodpi/workzen_logo.png

      - name: Build signed debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkZen-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
