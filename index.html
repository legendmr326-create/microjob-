<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJob TaskFlex</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

    <!-- Top Header -->
    <header class="bg-slate-900 p-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-lg">MicroJob TaskFlex</span>
        </div>
        <div class="flex items-center space-x-3">
            <button id="modeToggleBtn" onclick="toggleMode()" class="bg-indigo-600 px-3 py-1 text-sm rounded-lg font-medium">Worker Mode</button>
            <div id="profileIcon" class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center font-bold">U</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="p-4 flex-grow mb-16" id="mainContent">
        <!-- Worker View -->
        <div id="workerView">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-4">
                <p class="text-sm text-slate-400">Available Balance</p>
                <h2 class="text-2xl font-bold text-emerald-400" id="userBalance">৳ 0.00</h2>
                <div class="mt-3 flex justify-between">
                    <div>
                        <p class="text-xs text-slate-400">Pending Review</p>
                        <p class="text-sm font-semibold text-amber-400" id="pendingReview">৳ 0.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">Total Lifetime Earned</p>
                        <p class="text-sm font-semibold text-blue-400" id="totalEarned">৳ 0.00</p>
                    </div>
                </div>
                <button onclick="openCashout()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded-lg font-semibold">Cashout</button>
            </div>

            <!-- Task Statistics -->
            <div class="grid grid-cols-3 gap-2 text-center mb-4">
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <p class="text-xs text-slate-400">Pending</p>
                    <p class="text-lg font-bold" id="statPending">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <p class="text-xs text-slate-400">Approved</p>
                    <p class="text-lg font-bold text-emerald-400" id="statApproved">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <p class="text-xs text-slate-400">Rejected</p>
                    <p class="text-lg font-bold text-rose-400" id="statRejected">0</p>
                </div>
            </div>

            <!-- Jobs List -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h3 class="font-semibold mb-3">Active Microjobs</h3>
                <div id="jobListContainer" class="space-y-2">
                    <div class="flex justify-between items-center bg-slate-800 p-3 rounded-lg">
                        <span>একটি কাজ সম্পন্ন করুন</span>
                        <span class="text-emerald-400 font-bold">৳ 53</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Client View (Deposit Section) -->
        <div id="clientView" class="hidden">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-4">
                <h3 class="font-semibold mb-3 text-lg">Deposit Funds</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">Select Gateway</label>
                        <select id="depositMethod" class="w-full bg-slate-800 p-2 rounded-lg mt-1 border border-slate-700">
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Upay">Upay</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Personal Number (Send Money)</label>
                        <input type="text" id="personalNumber" value="01748021976" readonly class="w-full bg-slate-800 p-2 rounded-lg mt-1 text-slate-400 border border-slate-700">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Amount (BDT)</label>
                        <input type="number" id="depositAmount" placeholder="Enter amount" class="w-full bg-slate-800 p-2 rounded-lg mt-1 border border-slate-700">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Transaction ID (TrxID)</label>
                        <input type="text" id="depositTrxId" placeholder="Enter TrxID" class="w-full bg-slate-800 p-2 rounded-lg mt-1 border border-slate-700">
                    </div>
                    <button onclick="submitDeposit()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded-lg font-semibold mt-2">Submit Deposit</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-3">
        <button onclick="switchTab('home')" class="text-emerald-400 font-medium text-sm">Home</button>
        <button onclick="switchTab('jobs')" class="text-slate-400 font-medium text-sm">Jobs</button>
        <button onclick="switchTab('wallet')" class="text-slate-400 font-medium text-sm">Wallet</button>
        <button onclick="switchTab('settings')" class="text-slate-400 font-medium text-sm">Account</button>
    </nav>

    <script>
        let isClientMode = false;
        function toggleMode() {
            isClientMode = !isClientMode;
            const btn = document.getElementById('modeToggleBtn');
            const workerView = document.getElementById('workerView');
            const clientView = document.getElementById('clientView');
            if(isClientMode) {
                btn.innerText = "Client Mode";
                btn.className = "bg-purple-600 px-3 py-1 text-sm rounded-lg font-medium";
                workerView.classList.add('hidden');
                clientView.classList.remove('hidden');
            } else {
                btn.innerText = "Worker Mode";
                btn.className = "bg-indigo-600 px-3 py-1 text-sm rounded-lg font-medium";
                clientView.classList.add('hidden');
                workerView.classList.remove('hidden');
            }
        }
        function switchTab(tab) {
            if(tab === 'wallet') {
                alert("Withdraw & Deposit History sections available.");
            }
        }
        function submitDeposit() {
            alert("Deposit request submitted successfully!");
        }
        function openCashout() {
            alert("Opening Cashout Panel...");
        }
    </script>
</body>
</html>
